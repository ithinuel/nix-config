  - &tleilax_user age1qkzwzwutk8ddylflts5r7qvu7lhgr0zeh880r9tu8fsg3g5s84wsjep8vh
  - &ix age13gm6x5tru5x48yhvgwvwrc5grfnu8cpdlpd39jy6dpsmt9u2qq2qjfd7v6
  - &ix_user age1vy6utcttelw3ykae97ms0v9s8ph6g96q892hc45qhftvpt2cs58q7ggjj8
  - &octoprint age1dmejnvagm82fa6u0csst3ep4qwvvvvttqd8ygngyqlu9zrvcna6qqcsh4x
  - &octoprint_user age1zzpvdxhjxrm5rzr0k37vtgp7v5emkuzjvnzhhu3p68zg4a7ldvms2utwt9
  - &mba age1xahxzanp2p70w374fu30ah66v6m03xsprd5hc3deal8dsj3yv5dsjpdceh
  - &mba_user age1l9vdh7hle2cg9m9qzzg88rdy453zddv9zsq7qnd0atvmkqc0mvqqlkm6nx

# Naming grammar: see secrets/README.md
#   ${scope}[.${who}].${function}[.${subject}].enc.${format}
# scope is a hostname or the reserved literal `global`; first matching rule wins:
#   - who present (username, or `users` under global) => unlocked by those keys
#   - who absent => unlocked by the scope's machine keys
#     (that host's key; all hosts' keys under global)
# When onboarding a host or user: add their keys to the groups below,
# then `sops rotate` every global.* secret whose group changed.
creation_rules:
  # User-unlocked secrets (username in slot 2); must precede the host rules
  - path_regex: secrets/tleilax\.ithinuel\..*
    pgp: *at_ithinuel
    age: *tleilax_user
  - path_regex: secrets/ithinuel-air\.ithinuel\..*
    pgp: *at_ithinuel
    age: *mba_user
  - path_regex: secrets/ix\.ithinuel\..*
    pgp: *at_ithinuel
    age: *ix_user
  - path_regex: secrets/octoprint\.ithinuel\..*
    pgp: *at_ithinuel
    age: *octoprint_user

  # Host-unlocked secrets
  - path_regex: secrets/tleilax\..*
    pgp: *at_ithinuel
    age: *tleilax
  - path_regex: secrets/ithinuel-air\..*
    pgp: *at_ithinuel
    age: *mba
  - path_regex: secrets/ix\..*
    pgp: *at_ithinuel
    age: *ix
  - path_regex: secrets/octoprint\..*
    pgp: *at_ithinuel
    age: *octoprint

  # Portable user-unlocked secrets (all users' keys, all hosts);
  # must precede the broad global rule. Group: every per-host user key.
  - path_regex: secrets/global\.users\..*
    key_groups:
      - pgp:
          - *at_ithinuel
        age:
          - *tleilax_user
          - *mba_user
          - *ix_user
          - *octoprint_user

  # Portable user-unlocked secrets (all hosts, specific user’s key);
  # must precede the broad global rule. Group: every per-host user key.
  - path_regex: secrets/global\.ithinuel\..*
    key_groups:
      - pgp:
          - *at_ithinuel
        age:
          - *tleilax_user
          - *mba_user

  # Portable host-unlocked secrets (all hosts' keys). Group: every host key.
  # `global.<username>.*` (per-person portable) gets its own rule when used.
  - path_regex: secrets/global\..*
    key_groups:
      - pgp:
          - *at_ithinuel
        age:
          - *tleilax
          - *mba
          - *ix
          - *octoprint

  # Everything else
  - path_regex: secrets/.*
    pgp: *at_ithinuel
